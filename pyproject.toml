[project]
name = "hpclab"
version = "0.1.0"
description = "Reliable Slurm execution and traceable experiment evidence for ML researchers, exposed as MCP tools, a CLI and a Python API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "HPC Lab contributors" }]
keywords = ["slurm", "hpc", "mcp", "machine-learning", "experiments", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.8,<3",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
hpclab = "hpclab.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "anyio>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpclab"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "hpclab/_bundled/profiles"
"skills" = "hpclab/_bundled/skills"
"examples" = "hpclab/_bundled/examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
timeout = 120
markers = [
    "sim: end-to-end tests that run real local processes through the Slurm simulator",
    "slow: tests taking more than a few seconds",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "BLE"]
ignore = [
    "S101",   # assert in tests
    "S603",   # subprocess without shell is intentional; argv lists are built by us
    "S607",   # partial executable paths (ssh, rsync, sbatch) are resolved via PATH on purpose
    "S608",   # SQL built from constant fragments only; values always bound
    "RUF012", # pydantic/class-level mutable defaults are fine
    "SIM108",
    "E501",
    "RUF001", # unicode punctuation in strings/docstrings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"src/hpclab/sim/**" = ["S"]

[tool.mypy]
python_version = "3.12"
packages = ["hpclab"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
